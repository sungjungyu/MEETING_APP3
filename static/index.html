<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>이음 | 취향 기반 모임 매칭</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260604-2700" />
  </head>
  <body>
    <div id="app" class="phone">
      <header class="app-header">
        <button class="icon-button" id="backButton" aria-label="뒤로 가기"></button>
        <div>
          <p id="screenSubTitle"></p>
          <h1 id="screenTitle">이음</h1>
        </div>
        <button id="notifyButton" style="position:relative;width:36px;height:36px;border-radius:50%;background:var(--line);border:none;display:grid;place-items:center;" aria-label="알림">
          <span id="notifyIcon" style="font-size:16px;">&#128276;</span>
          <span id="notifyBadge" style="display:none;position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:#f43f5e;"></span>
        </button>
      </header>

      <main class="screen-stack">
        <section id="home" class="view active" data-title="이음" data-subtitle="">
          <div class="shortcut-grid">
            <button data-view="mymeetings"><span>★</span>내 모임</button>
            <button data-view="create"><span>＋</span>모임 만들기</button>
            <button data-view="calendar"><span>□</span>일정</button>
            <button data-view="chat"><span>●</span>채팅</button>
            <button data-view="profile"><span>○</span>MY</button>
            <button data-view="recommend"><span>💡</span>추천</button>
          </div>
          <section class="section-block">
            <div class="section-title">
              <h2>모임 목록</h2>
            </div>
            <div id="meetingList" class="list-stack"></div>
            <span id="meetingCount" class="hidden-count">0</span>
          </section>
        </section>

        <section id="meetings" class="view" data-title="모임 탐색" data-subtitle="모임 찾기">
          <div class="search-box">
            <input id="meetingSearch" placeholder="모임명, 카테고리 검색" />
          </div>
          <div class="search-box">
            <input id="locationSearch" placeholder="📍 지역 검색 (예: 강남, 홍대)" />
          </div>
          <div id="meetingPageList" class="list-stack"></div>
        </section>

        <section id="recommend" class="view" data-title="추천 모임" data-subtitle="맞춤 추천">
          <section id="recommendSection" class="section-block">
            <div class="section-title">
              <h2>모임추천</h2>
            </div>
            <div id="recommendList" class="recommend-list"></div>
          </section>
        </section>

        <section id="mymeetings" class="view" data-title="내 모임" data-subtitle="내가 속한 모임">
          <div class="section-block">
            <div class="section-title">
              <h2>나의 모임</h2>
            </div>
            <div id="myMeetingList" class="list-stack"></div>
          </div>
        </section>

        <section id="detail" class="view" data-title="모임 상세" data-subtitle="참여 신청">
          <div id="meetingDetail" class="detail-panel"></div>
          <div id="meetingScheduleSection" class="section-block" style="display:none;">
            <div class="section-title">
              <h2>모임 일정</h2>
              <button id="refreshMeetingSchedules" type="button">새로고침</button>
            </div>
            <div id="meetingScheduleList" class="list-stack"></div>
            <form id="meetingScheduleForm" class="form-screen compact" style="display:none; margin-top:12px; gap:10px;">
              <label>장소<input name="location" placeholder="예: 강남 카페" required /></label>
              <label>일정<input name="scheduled_at" type="datetime-local" required /></label>
              <label>활동 내용<textarea name="activity" placeholder="활동 내용을 작성하세요." required></textarea></label>
              <label>인원<input name="capacity" type="number" min="1" value="5" required /></label>
              <label>설정<textarea name="settings" placeholder="추가 설정이나 안내사항"></textarea></label>
              <button class="primary-button" type="submit">일정 추가</button>
              <p id="meetingScheduleStatus" class="status-text"></p>
            </form>
          </div>
        </section>

        <section id="create" class="view" data-title="모임 만들기" data-subtitle="모집 정보 입력">
          <form id="meetingForm" class="form-screen">
            <label>모임명<input name="title" placeholder="예: 수요일 저녁 AI 스터디" required /></label>
            <label>소개<textarea name="description" placeholder="모임 소개를 작성하세요." required></textarea></label>
            <div class="form-row">
              <label>카테고리
                <select name="category" required>
                  <option value="" disabled selected>카테고리 선택</option>
                  <option value="운동/스포츠">운동/스포츠</option>
                  <option value="러닝/마라톤">러닝/마라톤</option>
                  <option value="등산">등산</option>
                  <option value="스터디">스터디</option>
                  <option value="코딩">코딩</option>
                  <option value="독서">독서</option>
                  <option value="음악/예술">음악/예술</option>
                  <option value="문화/여가">문화/여가</option>
                  <option value="맛집">맛집</option>
                  <option value="카페">카페</option>
                  <option value="여행">여행</option>
                  <option value="사교/인맥">사교/인맥</option>
                  <option value="반려동물">반려동물</option>
                  <option value="봉사활동">봉사활동</option>
                  <option value="창업">창업</option>
                  <option value="기타">기타</option>
                </select>
              </label>
              <label>인원<input name="max_members" type="number" min="2" value="5" required /></label>
            </div>
            <label>지역 설정
              <div class="region-select-group">
                <select name="province" id="meetingProvinceSelect" required>
                  <option value="">도/특별시/광역시 선택</option>
                  <option value="서울">서울특별시</option>
                  <option value="부산">부산광역시</option>
                  <option value="대구">대구광역시</option>
                  <option value="인천">인천광역시</option>
                  <option value="광주">광주광역시</option>
                  <option value="대전">대전광역시</option>
                  <option value="울산">울산광역시</option>
                  <option value="세종">세종특별자치시</option>
                  <option value="경기">경기도</option>
                  <option value="강원">강원특별자치도</option>
                  <option value="충북">충청북도</option>
                  <option value="충남">충청남도</option>
                  <option value="전북">전북특별자치도</option>
                  <option value="전남">전라남도</option>
                  <option value="경북">경상북도</option>
                  <option value="경남">경상남도</option>
                  <option value="제주">제주특별자치도</option>
                </select>
                <select name="city" id="meetingCitySelect" disabled required>
                  <option value="">시/군/구 선택</option>
                </select>
              </div>
              <input type="hidden" name="region" id="meetingRegionInput" />
            </label>
            <label>키워드<input name="keywords" placeholder="성수, 카페, 대화" /></label>
            <div class="place-recommend-panel">
              <div class="place-recommend-head">
                <label>장소<input name="location" placeholder="공학관 301" required /></label>
                <button id="recommendPlaceButton" class="secondary-button" type="button">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 1 7 7c0 5.25-7 13-7 13S5 14.25 5 9a7 7 0 0 1 7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
                  장소 추천
                </button>
              </div>
              <div class="place-result-section" hidden>
                <div class="place-result-tabs">
                  <button type="button" class="place-result-tab active" data-result-tab="list">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    목록
                  </button>
                  <button type="button" class="place-result-tab" data-result-tab="map">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
                    지도
                  </button>
                </div>
                <div class="place-result-pane" id="resultPaneList">
                  <div id="placeRecommendationList" class="place-recommend-list"></div>
                </div>
                <div class="place-result-pane" id="resultPaneMap" hidden>
                  <div id="placeMapPanel" class="place-map-panel"></div>
                </div>
              </div>
            </div>
            <button class="primary-button" type="submit">등록하기</button>
            <p id="meetingStatus" class="status-text"></p>
          </form>
        </section>

        <section id="calendar" class="view" data-title="캘린더" data-subtitle="모임 일정">
          <div class="month-box">
            <div class="month-head">
              <button id="calendarPrev" type="button">‹</button>
              <strong id="calendarMonthLabel">2026. 06</strong>
              <button id="calendarNext" type="button">›</button>
            </div>
            <div id="calendarGrid" class="calendar-grid">
              <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
            </div>
          </div>
          <div id="calendarList" class="list-stack"></div>
        </section>

        <section id="chat" class="view" data-title="채팅" data-subtitle="실시간 대화">
          <div id="chatRoomListView" class="chat-room-list"></div>
        </section>

        <section id="chatRoom" class="view" data-title="채팅방" data-subtitle="실시간 대화">
          <section class="chat-panel">
            <div class="chat-head">
              <strong id="chatRoomTitle">채팅방</strong>
              <div class="chat-head-actions">
                <button id="aiRecommendButton" type="button" class="ai-recommend-btn" title="AI 장소 추천받기">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a7 7 0 0 1 7 7c0 5.25-7 13-7 13S5 14.25 5 9a7 7 0 0 1 7-7z"/>
                    <circle cx="12" cy="9" r="2.5"/>
                  </svg>
                  AI 장소 추천
                </button>
                <span id="chatState">연결 대기</span>
              </div>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <form id="chatForm" class="chat-form">
              <button type="button" id="chatPlusButton" class="chat-plus-btn" aria-label="추가 메뉴">+</button>
              <input name="content" placeholder="메시지 입력" autocomplete="off" required />
              <button type="submit" aria-label="전송"></button>
            </form>
          </section>
          
          <!-- 장소 추천 모달 -->
          <div id="aiRecommendModal" class="ai-recommend-modal" style="display:none;">
            <div class="ai-recommend-modal-backdrop"></div>
            <div class="ai-recommend-modal-content">
              <div class="ai-recommend-modal-header">
                <h3>
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a7 7 0 0 1 7 7c0 5.25-7 13-7 13S5 14.25 5 9a7 7 0 0 1 7-7z"/>
                    <circle cx="12" cy="9" r="2.5"/>
                  </svg>
                  AI 장소 추천
                </h3>
                <button type="button" id="closeAiRecommendModal" class="modal-close-btn" aria-label="닫기">✕</button>
              </div>
              
              <div class="ai-recommend-modal-body">
                <!-- 지도 영역 -->
                <div class="chat-map-section">
                  <div id="chatRecommendMapPanel" class="chat-map-panel">
                    <div class="map-loading">
                      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                      </svg>
                      <span>지도를 불러오는 중...</span>
                    </div>
                  </div>
                </div>
                
                <!-- 추천 장소 목록 -->
                <div class="chat-recommend-list-section">
                  <div class="chat-recommend-list-header">
                    <h4>추천 장소</h4>
                  </div>
                  <div id="chatRecommendList" class="chat-recommend-list">
                    <div class="recommend-placeholder">
                      AI가 모임 정보를 분석하여 맞춤 장소를 추천해 드립니다.
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          <!-- + 버튼 메뉴 팝업 -->
          <div id="chatPlusMenu" class="chat-plus-menu" style="display:none;">
            <button type="button" class="plus-menu-item" id="plusMenuRecommend">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a7 7 0 0 1 7 7c0 5.25-7 13-7 13S5 14.25 5 9a7 7 0 0 1 7-7z"/>
                <circle cx="12" cy="9" r="2.5"/>
              </svg>
              AI 장소 추천받기
            </button>
          </div>
          
          <!-- 장소 확정 컨펌 모달 -->
          <div id="placeConfirmModal" class="place-confirm-modal" style="display:none;">
            <div class="place-confirm-modal-backdrop"></div>
            <div class="place-confirm-modal-content">
              <div class="place-confirm-icon">📍</div>
              <h4 id="placeConfirmTitle">장소를 확정하시겠습니까?</h4>
              <p id="placeConfirmMessage">이 장소를 모임 장소로 설정합니다.</p>
              <div class="place-confirm-buttons">
                <button type="button" id="placeConfirmCancel" class="place-confirm-btn cancel">취소</button>
                <button type="button" id="placeConfirmOk" class="place-confirm-btn ok">확인</button>
              </div>
            </div>
          </div>
          
          <!-- 공통 알림 모달 -->
          <div id="appAlertModal" class="app-alert-modal" style="display:none;">
            <div class="app-alert-modal-backdrop"></div>
            <div class="app-alert-modal-content">
              <div class="app-alert-icon">ℹ️</div>
              <h4 id="appAlertTitle">알림</h4>
              <p id="appAlertMessage">메시지</p>
              <button type="button" id="appAlertOk" class="app-alert-btn">확인</button>
            </div>
          </div>
        </section>

        <section id="profile" class="view" data-title="내 정보" data-subtitle="프로필과 관심사">
          <div class="profile-panel">
            <div class="profile-avatar"></div>
            <h2 id="profileName">게스트</h2>
            <p id="profileEmail">로그인 후 추천을 받을 수 있어요.</p>
            <p id="profileRegion">지역 설정을 추가해 주세요.</p>
          </div>
          <section class="section-block">
            <div class="section-title">
              <h2>참여 신청 알림</h2>
              <button id="refreshApplications" type="button">새로고침</button>
            </div>
            <div id="applicationList" class="list-stack"></div>
          </section>
          <div class="profile-menu">
            <button data-view="login">로그인 / 회원가입</button>
            <button data-view="myposts">내 게시글</button>
            <button data-view="myapplications">내 신청 모임</button>
            <button data-view="editprofile">프로필 수정</button>
            <button id="logoutButton">로그아웃</button>
            <button data-view="calendar">내 일정</button>
          </div>
        </section>

        <section id="notifications" class="view" data-title="알림" data-subtitle="실시간 알림">
          <div id="notificationList" class="list-stack"></div>
        </section>

        <section id="myapplications" class="view" data-title="내 신청 모임" data-subtitle="신청 현황">
          <div id="myApplicationList" class="list-stack"></div>
        </section>

        <section id="editprofile" class="view" data-title="프로필 수정" data-subtitle="내 정보 변경">
          <form id="editProfileForm" class="form-screen">
            <label>이름<input name="name" placeholder="이름" required /></label>
            <label>자기소개<textarea name="bio" placeholder="자기소개"></textarea></label>
            <label>관심 분야 1
              <select name="interest1" id="interest1Select">
                <option value="">선택하세요</option>
                <option value="운동/스포츠">운동/스포츠</option>
                <option value="러닝/마라톤">러닝/마라톤</option>
                <option value="등산">등산</option>
                <option value="자전거">자전거</option>
                <option value="수영">수영</option>
                <option value="헬스/PT">헬스/PT</option>
                <option value="요가/필라테스">요가/필라테스</option>
                <option value="공부/자기계발">공부/자기계발</option>
                <option value="스터디">스터디</option>
                <option value="코딩">코딩</option>
                <option value="독서">독서</option>
                <option value="어학">어학</option>
                <option value="자격증">자격증</option>
                <option value="취업/면접">취업/면접</option>
                <option value="창업">창업</option>
                <option value="음악/예술">음악/예술</option>
                <option value="악기">악기</option>
                <option value="노래">노래</option>
                <option value="춤">춤</option>
                <option value="미술/그림">미술/그림</option>
                <option value="사진">사진</option>
                <option value="공연">공연</option>
                <option value="문화/여가">문화/여가</option>
                <option value="영화">영화</option>
                <option value="게임">게임</option>
                <option value="보드게임">보드게임</option>
                <option value="여행">여행</option>
                <option value="맛집">맛집</option>
                <option value="카페">카페</option>
                <option value="술/와인">술/와인</option>
                <option value="반려동물">반려동물</option>
                <option value="봉사활동">봉사활동</option>
                <option value="사교/인맥">사교/인맥</option>
                <option value="외국인">외국인</option>
              </select>
            </label>
            <label>관심 분야 2 (선택)
              <select name="interest2" id="interest2Select">
                <option value="">선택안함</option>
                <option value="운동/스포츠">운동/스포츠</option>
                <option value="러닝/마라톤">러닝/마라톤</option>
                <option value="등산">등산</option>
                <option value="자전거">자전거</option>
                <option value="수영">수영</option>
                <option value="헬스/PT">헬스/PT</option>
